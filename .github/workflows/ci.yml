# Builds the development image once (kept in GHCR, tagged by the Spinel
# commit and the Dockerfile), the firmware for lib/main.rb and every
# example with it, and runs test/qemu/*.rb under QEMU (rake test:qemu).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Name the image
        id: tag
        run: |
          spinel=$(cat .spinel-version)
          dockerfile=$(sha256sum docker/Dockerfile | cut -c1-12)
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/espinel-idf:v6.1-${spinel:0:12}-$dockerfile" >> "$GITHUB_OUTPUT"
          echo "spinel=$spinel" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for the image
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.exists.outputs.found != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4
        if: steps.exists.outputs.found != 'true'
        with:
          repository: matz/spinel
          ref: ${{ steps.tag.outputs.spinel }}
          path: .spinel-checkout

      - name: Build and push the image
        if: steps.exists.outputs.found != 'true'
        run: |
          docker build --build-context spinel=.spinel-checkout \
            -f docker/Dockerfile -t "${{ steps.tag.outputs.image }}" .
          docker push "${{ steps.tag.outputs.image }}"

  build:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      ESPINEL_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker pull "$ESPINEL_IMAGE"

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-build-${{ github.sha }}
          restore-keys: ccache-build-

      - name: Build for the ESP32-S3
        run: bundle exec rake build:all TARGET=esp32s3

      - name: Build for the ESP32-C3
        run: bundle exec rake build TARGET=esp32c3

      - name: Show the cache's hit rate
        if: always()
        run: bundle exec rake ccache

  qemu:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      ESPINEL_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker pull "$ESPINEL_IMAGE"

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-qemu-${{ github.sha }}
          restore-keys: ccache-qemu-

      - name: Run the tests under QEMU
        run: bundle exec rake test:qemu

      - name: Show the cache's hit rate
        if: always()
        run: bundle exec rake ccache

      - name: Keep the build and console logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-logs
          path: build-test/logs/
